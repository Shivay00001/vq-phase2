<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VisionOS — UX Concept Prototype</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- BOOT SCREEN -->
<div id="boot">
  <div class="boot-logo">◈</div>
  <div class="boot-name">VisionOS</div>
  <div class="boot-sub">UX CONCEPT PROTOTYPE — not a real operating system</div>
  <div class="boot-bar"><div class="boot-fill"></div></div>
</div>

<!-- DESKTOP -->
<div id="desktop" class="hidden">
  <div id="prototype-banner">UX CONCEPT PROTOTYPE — a web page, not an OS. Real subsystem: U-PERM capability library (see slice/uperm/).</div>
  <div id="icons"></div>
  <div id="windows"></div>
  <div id="taskbar">
    <button id="launcher-btn" title="Launcher">◈</button>
    <div id="taskbar-windows"></div>
    <div id="clock"></div>
  </div>
  <div id="launcher" class="hidden"></div>
</div>

<script src="fs.js"></script>
<script src="os.js"></script>
</body>
</html>
